apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate-execution-service
  namespace: oficina
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "${image_registry}oficina-execution-service:${image_tag}"
          imagePullPolicy: ${image_pull_policy}
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Aguardando PostgreSQL aceitar conexoes..."
              until npx prisma migrate deploy; do
                echo "Migration falhou, tentando novamente em 5s..."
                sleep 5
              done
              echo "Migration concluida."
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oficina-execution-service-secrets
                  key: DATABASE_URL
